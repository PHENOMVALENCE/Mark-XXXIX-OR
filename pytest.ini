[pytest]
# The repository root is not an installed package — main.py, ui.py, actions/,
# and agent/ are imported by path. pythonpath puts the root on sys.path so
# both `pytest` and `python -m pytest` work; without it only the latter did,
# because that form happens to add the working directory.
pythonpath = .

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    --strict-markers
    --strict-config
    -ra

filterwarnings =
    # google-generativeai is retired and warns on import. Tracked in
    # docs/ROADMAP.md Phase 3: consolidate onto google-genai.
    ignore:.*google\.generativeai.*:FutureWarning
